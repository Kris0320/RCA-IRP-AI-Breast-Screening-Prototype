<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap');</style></defs>
<rect width="1920" height="1080" fill="#EFF0F2"/>

<!-- ══ HEADER ══ -->
<text x="160" y="56"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="14" font-weight="600" fill="#124BCE" letter-spacing="3">SECTION LABEL · 14px · 600 · --blue · UPPERCASE · letter-spacing 3</text>
<line x1="160" y1="68" x2="1760" y2="68" stroke="#C4C8D2" stroke-width="1"/>
<text x="1760" y="56" text-anchor="end"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="14" font-weight="400" fill="#6B7280">Slide counter · 14px · 400 · --mid</text>

<!-- ══ H1 + SUBTITLE ══ -->
<text x="160" y="148"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="64" font-weight="700" fill="#111827">H1 Large · 64px · 700 · --dark #111827 · line-height 120%</text>
<text x="160" y="204"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="24" font-weight="400" fill="#6B7280">Subtitle/caption · 24px · 400 · --mid #6B7280 · line-height 150%</text>

<!-- ══ CARD 1 · x=160 w=500 ══ -->
<rect x="160" y="232" width="500" height="520" fill="#FFFFFF" rx="8"/>

<!-- Tag -->
<rect x="184" y="256" width="200" height="26" fill="#124BCE" rx="4"/>
<text x="190" y="274"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">TAG · 11px · 700 · --white on --blue</text>

<!-- Stat hero -->
<text x="184" y="370"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="56" font-weight="700" fill="#124BCE">00% · 56px · 700 · --blue</text>

<!-- Stat label -->
<text x="184" y="410"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="14" font-weight="600" fill="#6B7280">Stat source line · 14px · 400 · --mid</text>

<!-- Divider -->
<line x1="184" y1="432" x2="636" y2="432" stroke="#E5E7EB" stroke-width="1"/>

<!-- Card title · gap-above-divider 40 -->
<text x="184" y="472"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="20" font-weight="700" fill="#111827">Card Title · 20px · 700 · --dark · gap-above 40</text>

<!-- Card body · gap-above 32 · line gap 20 -->
<text x="184" y="504"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="14" font-weight="400" fill="#6B7280">Card body · 14px · 400 · --mid · gap-above 32</text>
<text x="184" y="524"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="14" font-weight="400" fill="#6B7280">Second body line · line gap 20 · max 3 lines</text>

<!-- Card source -->
<text x="184" y="726"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="12" font-weight="400" fill="#6B7280" font-style="italic">Card source · 12px · 400 · --mid · italic</text>

<!-- ══ CARD 2 · x=700 w=500 ══ -->
<rect x="700" y="232" width="500" height="520" fill="#FFFFFF" rx="8"/>

<rect x="724" y="256" width="200" height="26" fill="#124BCE" rx="4"/>
<text x="730" y="274"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">TAG · 11px · 700 · --white on --blue</text>

<text x="724" y="370"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="56" font-weight="700" fill="#124BCE">00% · 56px · 700 · --blue</text>

<text x="724" y="410"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="14" font-weight="600" fill="#6B7280">Stat source line · 14px · 400 · --mid</text>

<line x1="724" y1="432" x2="1176" y2="432" stroke="#E5E7EB" stroke-width="1"/>

<text x="724" y="472"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="20" font-weight="700" fill="#111827">Card Title · 20px · 700 · --dark · gap-above 40</text>

<text x="724" y="504"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="14" font-weight="400" fill="#6B7280">Card body · 14px · 400 · --mid · gap-above 32</text>
<text x="724" y="524"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="14" font-weight="400" fill="#6B7280">Second body line · line gap 20 · max 3 lines</text>

<text x="724" y="726"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="12" font-weight="400" fill="#6B7280" font-style="italic">Card source · 12px · 400 · --mid · italic</text>

<!-- ══ CARD 3 · x=1240 w=520 (to x=1760) ══ -->
<!-- Secondary/contrast variant: --mid tag -->
<rect x="1240" y="232" width="520" height="520" fill="#FFFFFF" rx="8"/>

<rect x="1264" y="256" width="240" height="26" fill="#6B7280" rx="4"/>
<text x="1270" y="274"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">TAG CONTRAST · --mid variant</text>

<text x="1264" y="370"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="56" font-weight="700" fill="#6B7280">00% · 56px · 700 · --mid</text>

<text x="1264" y="410"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="14" font-weight="600" fill="#6B7280">Secondary card · stat in --mid (not primary)</text>

<line x1="1264" y1="432" x2="1736" y2="432" stroke="#E5E7EB" stroke-width="1"/>

<text x="1264" y="472"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="20" font-weight="700" fill="#111827">Card Title · 20px · 700 · --dark · gap-above 40</text>

<text x="1264" y="504"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="14" font-weight="400" fill="#6B7280">Card body · 14px · 400 · --mid · gap-above 32</text>
<text x="1264" y="524"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="14" font-weight="400" fill="#6B7280">Second body line · line gap 20 · max 3 lines</text>

<text x="1264" y="726"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="12" font-weight="400" fill="#6B7280" font-style="italic">Card source · 12px · 400 · --mid · italic</text>

<!-- ══ BOTTOM STATEMENT ══ -->
<line x1="160" y1="800" x2="1760" y2="800" stroke="#C4C8D2" stroke-width="1"/>
<text x="160" y="860"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="22" font-weight="700" fill="#124BCE">Bottom statement · 22px · 700 · --blue · full width · single line</text>

<!-- TYPE LABEL -->
<text x="160" y="1055"
  font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
  font-size="11" font-weight="600" fill="#C4C8D2" letter-spacing="2">TYPE D — THREE-COLUMN CARDS · bg --bg #EFF0F2 · cards x=160/700/1240 w=500/500/520 · gap=40px · card rx=8 · card padding-left=24px</text>
</svg>
