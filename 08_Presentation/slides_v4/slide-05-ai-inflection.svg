<rect width="1920" height="1080" fill="#EFF0F2"/>

<!-- HEADER -->
<text x="160" y="60" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#124BCE" letter-spacing="3">CONTEXT</text>
<line x1="160" y1="74" x2="1760" y2="74" stroke="#C4C8D2" stroke-width="1"/>
<text x="1760" y="60" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="end">5 / 29</text>

<!-- H1 -->
<text x="160" y="154" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="700" fill="#111827">AI in breast screening: where is it now?</text>
<text x="160" y="192" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6B7280">The UK has active pilots — but no approved live clinical AI service yet.</text>


<!-- ══════════════════════════════════════════════
     UK SECTION LABEL (spanning cards 1+2)
     ══════════════════════════════════════════════ -->
<rect x="160" y="212" width="1000" height="26" fill="#124BCE" rx="2"/>
<text x="660" y="230" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">UNITED KINGDOM — PILOTS ACTIVE · NO LIVE CLINICAL SERVICE</text>

<!-- ══════════════════════════════════════════════
     CARD 1 — Kheiron · NHS Grampian   x=160 w=500
     ══════════════════════════════════════════════ -->
<image x="160" y="258" width="500" height="160" href="https://ukstories.microsoft.com/wp-content/uploads/2024/04/GeraldLip-768x512-1.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip0)"/>

<text x="160" y="450" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="900" fill="#124BCE">+12%</text>
<text x="160" y="472" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#111827">more cancers detected</text>
<line x1="160" y1="490" x2="660" y2="490" stroke="#C4C8D2" stroke-width="1"/>

<text x="160" y="518" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">Kheiron Mia · NHS Grampian</text>
<text x="160" y="542" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B7280">CE-marked AI second reader, 10,889-patient NHS trial.</text>
<text x="160" y="562" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B7280">30% workload reduction modelled. Now live at 16 NHS sites.</text>
<text x="160" y="600" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#9CA3AF" font-style="italic">¹ NHS Grampian / Kheiron / Microsoft, 2024</text>


<!-- ══════════════════════════════════════════════
     CARD 2 — AIMS Study · Imperial + Google   x=680 w=500
     ══════════════════════════════════════════════ -->
<image x="680" y="258" width="500" height="160" href="https://www.imperial.ac.uk/news/media/news-images/3000x2000-main-article-images/2026-03-10-breast-cancer-scan.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip1)"/>

<text x="680" y="450" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="900" fill="#124BCE">+25%</text>
<text x="680" y="472" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#111827">interval cancers detected</text>
<line x1="680" y1="490" x2="1180" y2="490" stroke="#C4C8D2" stroke-width="1"/>

<text x="680" y="518" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">AIMS Study · Imperial + Google Health</text>
<text x="680" y="542" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B7280">175,000-woman NHS study — largest to date.</text>
<text x="680" y="562" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B7280">AI matched or exceeded radiologist performance. Workload −40%.</text>
<text x="680" y="600" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#9CA3AF" font-style="italic">² Imperial College London / Google Health, Nature Cancer, 2026</text>


