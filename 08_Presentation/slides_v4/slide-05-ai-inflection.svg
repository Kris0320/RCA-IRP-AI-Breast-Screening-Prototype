     CARD 3 — Vara · Germany   x=1230 w=530
     Visually secondary: orange label, smaller heading
     ══════════════════════════════════════════════ -->
<rect x="1230" y="212" width="530" height="26" fill="#6B7280" rx="2"/>
<text x="1495" y="230" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CONTRAST — LIVE SERVICE · GERMANY</text>

<image x="1230" y="258" width="530" height="160" href="https://vara.ai/wp-content/uploads/2023/03/vara-product-screenshot.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip2)"/>

<text x="1230" y="450" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="900" fill="#6B7280">+17.6%</text>
<text x="1230" y="472" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#111827">cancer detection rate</text>
<line x1="1230" y1="490" x2="1760" y2="490" stroke="#C4C8D2" stroke-width="1"/>

<text x="1230" y="518" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">Vara · Germany National Screening Programme</text>
<text x="1230" y="542" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B7280">CE-marked AI, 40% of national programme. 1.5M mammograms/year.</text>
<text x="1230" y="562" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B7280">What a deployed live service looks like — the UK is not here yet.</text>
<text x="1230" y="600" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#9CA3AF" font-style="italic">³ Vara / PRAIM Study (500,000 participants), 2025</text>


<!-- TAKEAWAY -->
<line x1="160" y1="780" x2="1760" y2="780" stroke="#C4C8D2" stroke-width="1"/>
<text x="160" y="826" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#6B7280">AI is already reading mammograms in the UK — but only within trials and pilots, not as an approved clinical service.</text>
<text x="160" y="878" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#124BCE">The UK has active pilots. But no live clinical AI service — yet.</text>

