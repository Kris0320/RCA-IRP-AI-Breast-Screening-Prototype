<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,300;1,400;1,700&amp;display=swap');</style></defs>
<rect width="1920" height="1080" fill="#EFF0F2"/>

<!-- HEADER -->
<text x="160" y="60" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#124BCE" letter-spacing="3">RESEARCH</text>
<line x1="160" y1="74" x2="1760" y2="74" stroke="#C4C8D2" stroke-width="1"/>
<text x="1760" y="60" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="end">13 / 29</text>

<!-- H1 + SUBTITLE -->
<text x="160" y="148" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="700" fill="#111827">Five gaps. One pattern.</text>
<text x="160" y="186" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6B7280">Across expert consultations, public interviews, and nine workflow models analysed.</text>


<!-- ═══════════════════════════════════════════════
     GAP 01 — Cognitive Load Gap   x=160  w=300  h=340
     ═══════════════════════════════════════════════ -->
<rect x="160" y="216" width="300" height="340" fill="#124BCE" rx="4"/>
<text x="176" y="252" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.6)" letter-spacing="2">01</text>
<text x="444" y="252" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="end" letter-spacing="1.5">DESIGN FOCUS</text>
<text x="176" y="298" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Cognitive</text>
<text x="176" y="322" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Load Gap</text>
<line x1="176" y1="344" x2="444" y2="344" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
<text x="176" y="380" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="rgba(255,255,255,0.88)">· Hierarchy bias under disagreement</text>
<text x="176" y="408" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="rgba(255,255,255,0.88)">· AI excluded from discussion</text>
<text x="176" y="436" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="rgba(255,255,255,0.88)">· Confidence scores ignored</text>


<!-- ═══════════════════════════════════════════════
     GAP 02 — Arbitration Workflow Gap   x=485  w=300  h=340
     ═══════════════════════════════════════════════ -->
<rect x="485" y="216" width="300" height="340" fill="#124BCE" rx="4"/>
<text x="501" y="252" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.6)" letter-spacing="2">02</text>
<text x="769" y="252" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="end" letter-spacing="1.5">DESIGN FOCUS</text>
<text x="501" y="298" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Arbitration</text>
<text x="501" y="322" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Workflow Gap</text>
<line x1="501" y1="344" x2="769" y2="344" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
<text x="501" y="380" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="rgba(255,255,255,0.88)">· Reduces screening volume long-term</text>
<text x="501" y="408" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="rgba(255,255,255,0.88)">· Transition increases arbitration cases</text>
<text x="501" y="436" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="rgba(255,255,255,0.88)">· No changeover protocol</text>


<!-- ═══════════════════════════════════════════════
     GAP 03 — AI Capability Gap   x=810  w=300  h=340
     ═══════════════════════════════════════════════ -->
<rect x="810" y="216" width="300" height="340" fill="#E4E7EF" rx="4"/>
<text x="826" y="252" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#9CA3AF" letter-spacing="2">03</text>
<text x="826" y="298" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">AI Capability</text>
<text x="826" y="322" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">Gap</text>
<line x1="826" y1="344" x2="1094" y2="344" stroke="#C4C8D2" stroke-width="1"/>
<text x="826" y="380" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B7280">· Essential for trust calibration</text>
<text x="826" y="408" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B7280">· Training data opaque</text>
<text x="826" y="436" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B7280">· No performance feedback</text>


<!-- ═══════════════════════════════════════════════
     GAP 04 — Traceability   x=1135  w=300  h=340
     ═══════════════════════════════════════════════ -->
<rect x="1135" y="216" width="300" height="340" fill="#E4E7EF" rx="4"/>
<text x="1151" y="252" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#9CA3AF" letter-spacing="2">04</text>
<text x="1151" y="298" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">Traceability &amp;</text>
<text x="1151" y="322" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">Accountability Gap</text>
<line x1="1151" y1="344" x2="1419" y2="344" stroke="#C4C8D2" stroke-width="1"/>
<text x="1151" y="380" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B7280">· Outcome only — not process</text>
<text x="1151" y="408" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B7280">· Scores not recorded</text>
<text x="1151" y="436" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B7280">· Overrides undocumented</text>


<!-- ═══════════════════════════════════════════════
     GAP 05 — Technology Instability   x=1460  w=300  h=340
     ═══════════════════════════════════════════════ -->
<rect x="1460" y="216" width="300" height="340" fill="#E4E7EF" rx="4"/>
<text x="1476" y="252" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#9CA3AF" letter-spacing="2">05</text>
<text x="1476" y="298" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">Data / Technology</text>
<text x="1476" y="322" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">Instability</text>
<line x1="1476" y1="344" x2="1744" y2="344" stroke="#C4C8D2" stroke-width="1"/>
<text x="1476" y="380" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B7280">· Processed data only</text>
<text x="1476" y="408" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B7280">· Updates shift behaviour</text>
<text x="1476" y="436" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B7280">· Varies across vendors</text>


<!-- DESIGN FOCUS INDICATOR -->
<line x1="160" y1="598" x2="785" y2="598" stroke="#124BCE" stroke-width="2"/>
<text x="472" y="622" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#124BCE" text-anchor="middle" letter-spacing="1">READING &amp; ARBITRATION — DESIGN FOCUS</text>

<!-- TAKEAWAY -->
<text x="160" y="710" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#6B7280">Research revealed five systemic gaps. Two appear at the most critical moments in the clinical workflow.</text>
<text x="160" y="758" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#124BCE">Reading and Arbitration — the two moments where the system has no agreed answer.</text>

</svg>
