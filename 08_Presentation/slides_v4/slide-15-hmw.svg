<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,300;1,400;1,700&amp;display=swap');</style></defs>
<rect width="1920" height="1080" fill="#EFF0F2"/>

<!-- HEADER -->
<text x="160" y="60" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#124BCE" letter-spacing="3">RESEARCH</text>
<line x1="160" y1="74" x2="1760" y2="74" stroke="#C4C8D2" stroke-width="1"/>
<text x="1760" y="60" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="end">15 / 29</text>

<!-- TITLE -->
<text x="160" y="148" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="700" fill="#111827">From Diagnostic Accuracy</text>
<text x="160" y="220" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="700" fill="#111827">to Disagreement Support</text>

<!-- ══════════════════════════════════════════════
     LEFT — Problem Statement  (secondary weight)
     x=160  w=480
     ══════════════════════════════════════════════ -->
<text x="160" y="278" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#9CA3AF" letter-spacing="3">PROBLEM STATEMENT</text>
<line x1="160" y1="292" x2="640" y2="292" stroke="#C4C8D2" stroke-width="1"/>

<text x="160" y="330" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#9CA3AF">As AI enters breast cancer screening,</text>
<text x="160" y="354" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#9CA3AF">human-AI disagreement is becoming a critical</text>
<text x="160" y="378" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#9CA3AF">moment where radiologists must balance machine</text>
<text x="160" y="402" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#9CA3AF">outputs, peer judgement, clinical responsibility</text>
<text x="160" y="426" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#9CA3AF">and organisational accountability. Yet current AI</text>
<text x="160" y="450" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#9CA3AF">implementation focuses more on accuracy and</text>
<text x="160" y="474" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#9CA3AF">efficiency than on supporting radiologists'</text>
<text x="160" y="498" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#9CA3AF">cognitive, emotional, collaborative and learning</text>
<text x="160" y="522" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#9CA3AF">needs during disagreement.</text>

<!-- vertical separator -->
<line x1="700" y1="270" x2="700" y2="640" stroke="#C4C8D2" stroke-width="1"/>

<!-- ══════════════════════════════════════════════
     RIGHT — HMW  (primary weight)
     x=760  w=1000
     ══════════════════════════════════════════════ -->
<text x="760" y="278" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#124BCE" letter-spacing="3">HOW MIGHT WE</text>
<line x1="760" y1="292" x2="1760" y2="292" stroke="#124BCE" stroke-width="2"/>

<text x="760" y="348" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#111827">How might we support radiologists in safely</text>
<text x="760" y="392" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#111827">managing human-AI disagreement in breast cancer</text>
<text x="760" y="436" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#111827">screening — while reducing cognitive burden,</text>
<text x="760" y="480" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#111827">strengthening peer arbitration, documenting</text>
<text x="760" y="524" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#111827">clinical reasoning, and turning disagreement</text>
<text x="760" y="568" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#124BCE">into continuous learning and governance improvement?</text>

<!-- TAKEAWAY -->
<line x1="160" y1="856" x2="1760" y2="856" stroke="#C4C8D2" stroke-width="1"/>
<text x="160" y="900" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#6B7280">The design challenge is not building better AI — it is supporting the moment when AI and human diverge.</text>
<text x="160" y="952" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#124BCE">The gap is not detection. It is disagreement management.</text>

</svg>
