<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,300;1,400;1,700&amp;display=swap');</style></defs>
<rect width="1920" height="1080" fill="#EFF0F2"/>

<!-- HEADER -->
<text x="160" y="60" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#124BCE" letter-spacing="3">RESEARCH</text>
<line x1="160" y1="74" x2="1760" y2="74" stroke="#C4C8D2" stroke-width="1"/>
<text x="1760" y="60" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="end">— / —</text>

<!-- TITLE -->
<text x="160" y="148" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="700" fill="#111827">Our research methodology, in three phases.</text>
<text x="160" y="186" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#6B7280">From understanding the system — to the people within it — to validating our response.</text>


<!-- ══════════════════════════════════════
     PHASE 01   x=160  w=500  h=460
     ══════════════════════════════════════ -->
<rect x="160" y="216" width="500" height="460" fill="#FFFFFF" rx="8"/>
<rect x="160" y="216" width="6" height="460" fill="#124BCE" rx="3"/>

<text x="186" y="262" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#124BCE" letter-spacing="2">PHASE 01</text>

<text x="186" y="310" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">Understand</text>
<text x="186" y="344" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">the System</text>

<line x1="186" y1="370" x2="636" y2="370" stroke="#E5E7EB" stroke-width="1"/>

<text x="186" y="412" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#374151">· Desk research / literature review</text>
<text x="186" y="456" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#374151">· AI breast screening precedent review</text>
<text x="186" y="500" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#374151">· Workflow mapping</text>
<text x="186" y="544" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#374151">· Stakeholder mapping</text>


<!-- ══════════════════════════════════════
     PHASE 02   x=710  w=500  h=460
     ══════════════════════════════════════ -->
<rect x="710" y="216" width="500" height="460" fill="#FFFFFF" rx="8"/>
<rect x="710" y="216" width="6" height="460" fill="#124BCE" rx="3"/>

<text x="736" y="262" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#124BCE" letter-spacing="2">PHASE 02</text>

<text x="736" y="310" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">Understand</text>
<text x="736" y="344" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">the People</text>

<line x1="736" y1="370" x2="1186" y2="370" stroke="#E5E7EB" stroke-width="1"/>

<text x="736" y="412" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#374151">· Online ethnography</text>
<text x="736" y="456" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#374151">· Semi-structured interviews</text>
<text x="736" y="500" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#374151">· Radiologist-centred journey mapping</text>
<text x="736" y="544" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#374151">· Human factors analysis</text>


<!-- ══════════════════════════════════════
     PHASE 03   x=1260  w=500  h=460
     ══════════════════════════════════════ -->
<rect x="1260" y="216" width="500" height="460" fill="#FFFFFF" rx="8"/>
<rect x="1260" y="216" width="6" height="460" fill="#E8693C" rx="3"/>

<text x="1286" y="262" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#E8693C" letter-spacing="2">PHASE 03</text>

<text x="1286" y="310" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">Validate</text>
<text x="1286" y="344" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">the Design</text>

<line x1="1286" y1="370" x2="1736" y2="370" stroke="#E5E7EB" stroke-width="1"/>

<text x="1286" y="412" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#374151">· Concept testing</text>
<text x="1286" y="456" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#374151">· Prototype testing</text>
<text x="1286" y="500" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#374151">· Expert-informed feedback</text>
<text x="1286" y="544" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#374151">· Thematic analysis</text>


<!-- BOTTOM TAKEAWAY -->
<text x="160" y="748" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#124BCE">Each phase built directly on the previous — from mapping complexity to designing and testing within it.</text>

</svg>
